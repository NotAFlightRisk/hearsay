name: 🚀 Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Build and deploy
    if: github.repository_owner == 'NotAFlightRisk'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hearsay.peng.ly
    steps:
      - name: Check there's somewhere to deploy to
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing gets deployed"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.ready.outputs.go == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      - run: npm run check
        if: steps.ready.outputs.go == 'true'
      - run: npm test
        if: steps.ready.outputs.go == 'true'
      - run: npm run build
        if: steps.ready.outputs.go == 'true'
        env:
          ADAPTER: cloudflare
          PUBLIC_PLAUSIBLE_SCRIPT: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Push it to Cloudflare
        if: steps.ready.outputs.go == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: ${{ secrets.RADAR_TOKEN != '' && 'RADAR_TOKEN' || '' }}

      - name: Push the relay to Cloudflare
        if: steps.ready.outputs.go == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c src/relay/wrangler.jsonc

      - name: Check the new build is live and serving incidents
        if: steps.ready.outputs.go == 'true'
        run: |
          site=$(node -p "require('./package.json').homepage")
          built=$(node -p "require('./.svelte-kit/cloudflare/_app/version.json').version")
          for _ in $(seq 1 20); do
            live=$(curl -fsS "$site/_app/version.json?$built" | node -pe "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true)
            [ "$live" = "$built" ] && break
            sleep 6
          done
          if [ "$live" != "$built" ]; then
            echo "❌ [$site]($site) is still serving $live, not $built" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          radar=$(curl -fsS -H 'Cache-Control: no-cache' "$site/api/incidents?deploy=$built" | node -pe "JSON.parse(require('fs').readFileSync(0)).radar" 2>/dev/null || echo error)
          if [ "$radar" = error ]; then
            echo "❌ [$site]($site) is up but /api/incidents isn't answering" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          relay=$(curl -sS -o /dev/null -w '%{http_code}' "$site/feed" || true)
          if [ "$relay" != 426 ]; then
            echo "❌ [$site/feed]($site/feed) answered $relay, so the relay isn't on its route" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ [$site]($site) is live (Radar incidents: $radar), and so is the relay" >> "$GITHUB_STEP_SUMMARY"
